services:
  mysql:
    image: mysql:8.0
    container_name: lpr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Lpr#Dev_2026!"
      MYSQL_DATABASE: "SistemaLPR"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pLpr#Dev_2026!"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lpr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lpr-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lpr-keycloak
    command: start-dev
    environment:
      # Both pairs are set for compatibility across Keycloak versions (older KEYCLOAK_ADMIN*
      # vs newer KC_BOOTSTRAP_ADMIN_*); unused ones are simply ignored.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "Lpr#Dev_2026!"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Lpr#Dev_2026!"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  keycloak_data:
